<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Management Portal — Elmeasure</title>
<style>
  :root{
    --navy:#0B2942; --volt:#0073C8; --ink:#e2ecff;
    --text-hi:#16264d; --text-mid:#3b5384; --text-lo:#7a8fb8;
    --line:#d8dce6; --panel:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:'Calibri','Carlito',sans-serif;}

  .shell{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Horizontal top bar, matching the Friday Review sheet's header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;
    background:linear-gradient(120deg,var(--navy),var(--volt) 130%);
    padding:14px 22px;box-shadow:0 4px 14px rgba(20,42,92,.18);z-index:10;flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .logo-badge{
    background:linear-gradient(135deg,#123a5c,#06192b);border:1px solid rgba(255,255,255,.18);
    border-radius:999px;padding:6px 16px 6px 6px;display:flex;align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,.35);flex:0 0 auto;
  }
  .logo-chip{
    background:#fff;border-radius:9px;padding:7px 14px;display:flex;align-items:center;
    justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .logo-chip img{height:30px;width:auto;display:block;}
  .brand-title{font-weight:700;font-size:18px;letter-spacing:.04em;line-height:1.2;color:#fff;}
  .brand-sub{font-size:12px;color:rgba(255,255,255,.72);margin-top:2px;letter-spacing:.02em;}

  /* ── Hamburger nav ── */
  #hamburgerBtn{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.32);border-radius:9px;padding:8px 18px;cursor:pointer;color:#fff;font-size:13.5px;font-weight:700;letter-spacing:.03em;transition:background .15s;font-family:inherit;}
  #hamburgerBtn:hover{background:rgba(255,255,255,.24);}
  #hamburgerBtn .hbi{font-size:17px;line-height:1;}
  .seg{display:none;flex-direction:column;position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 32px rgba(11,41,66,.20);z-index:300;min-width:210px;}
  .seg.open{display:flex;}
  .tab-btn{
    font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--text-mid);background:transparent;
    border:none;padding:10px 16px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;
    text-align:left;width:100%;
  }
  .tab-btn.active{background:rgba(0,115,200,.1);color:var(--volt);}
  .tab-btn:hover{background:#f0f5ff;color:var(--text-hi);}

  .content{flex:1;position:relative;overflow:hidden;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:var(--ink);}
  iframe.active{display:block;}
  .boot-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-lo);font-family:monospace;font-size:13px;}
</style>


</head>

<script>
/* Each dashboard below is a COMPLETE, self-contained HTML document (its own
   CSS and JS), base64-encoded and injected into its own iframe via srcdoc.
   This keeps them fully isolated from each other (no ID/class collisions)
   while still shipping as a single file. srcdoc iframes inherit the parent
   page's origin, so relative fetches like '/api/leads' still resolve
   correctly against your Vercel deployment. */

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);

const ADMIN_EMAIL = 'suhas.s@elmeasure.com';
// Auth regions are fetched live from Supabase so they always match actual data.
// Populated by loadAuthRegions() before the edit modal opens.
let __authRegions  = [];

// ── Fetch distinct region names from leads_cache + potentials_cache ──────────
async function loadAuthRegions() {
  if (__authRegions.length) return; // already loaded
  const SUPA_URL  = 'https://xfdfbrfudsaxqgpsdboa.supabase.co/rest/v1';
  const SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmZGZicmZ1ZHNheHFncHNkYm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3OTA1MzgsImV4cCI6MjA5NzM2NjUzOH0.sfUC5Mn_d7-FGkvQHyD01kdGM81TjG4VWzXoFv43n94';
  const hdrs = { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY };

  // Paginate to collect every region across both tables (handles >1000 records)
  async function allRegions(table) {
    const PAGE = 1000;
    let from = 0, rows = [], total = null;
    while (true) {
      const res = await fetch(SUPA_URL + '/' + table + '?select=region&order=region', {
        headers: { ...hdrs, Range: from + '-' + (from + PAGE - 1) }
      });
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) break;
      rows.push(...data);
      const cr = res.headers.get('content-range');
      if (cr) { const [,t] = cr.split('/'); if (t && t !== '*') total = parseInt(t, 10); }
      from += data.length;
      if ((total !== null && from >= total) || data.length < PAGE) break;
    }
    return rows;
  }

  try {
    const [lRows, pRows] = await Promise.all([allRegions('leads_cache'), allRegions('potentials_cache')]);
    const all = [...lRows, ...pRows];
    const unique = [...new Set(all.map(r => r.region).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    __authRegions = unique;
  } catch(e) {
    console.warn('loadAuthRegions failed:', e);
  }
}

// ── Show a tab by directly manipulating DOM ──────────────────
function showPortalTab(target) {
  // Handle iframes
  document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  const authPanel = document.getElementById('frame-authorization');
  if (target === 'authorization') {
    authPanel.style.display = 'block';
    loadAuthPanel();
  } else {
    authPanel.style.display = 'none';
    const frame = document.getElementById('frame-' + target);
    if (frame) frame.classList.add('active');
  }
  const btn = document.querySelector('.tab-btn[data-target="' + target + '"]');
  if (btn) btn.classList.add('active');
}

// ── Google login callback ────────────────────────────────────
async function handleGoogleLogin(credentialResponse) {
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    const payload = JSON.parse(atob(credentialResponse.credential.split('.')[1]
      .replace(/-/g,'+').replace(/_/g,'/')));
    const email   = (payload.email || '').toLowerCase();
    const name    = payload.name  || email;
    const picture = payload.picture || '';

    if (!email.endsWith('@elmeasure.com')) {
      errEl.textContent = 'Only @elmeasure.com accounts are allowed.';
      errEl.style.display = 'block';
      return;
    }

    if (email === ADMIN_EMAIL) {
      window.__userPerms = {
        email, name, picture,
        allowedTabs:    ['leads','potentials','aiagents','createleads','authorization'],
        allowedRegions: []
      };
    } else {
      const r = await fetch('/api/user-permissions?email=' + encodeURIComponent(email));
      if (!r.ok) {
        errEl.textContent = 'Your account is not authorized. Contact suhas.s@elmeasure.com.';
        errEl.style.display = 'block';
        return;
      }
      const perms = await r.json();
      if (!perms.is_active) {
        errEl.textContent = 'Your access has been disabled. Contact the administrator.';
        errEl.style.display = 'block';
        return;
      }
      window.__userPerms = {
        email, name, picture,
        allowedTabs:    perms.allowed_tabs    || ['leads'],
        allowedRegions: perms.allowed_regions || []
      };
    }

    // Set region cookie
    const regions = window.__userPerms.allowedRegions || [];
    document.cookie = 'pm_regions=' + encodeURIComponent(regions.join(',')) +
                      ';path=/;SameSite=Lax;max-age=86400';

    // Apply tab visibility
    const allowed = window.__userPerms.allowedTabs;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      const t = btn.dataset.target;
      btn.style.display = (t && allowed.includes(t)) ? '' : 'none';
    });

    // Show first allowed tab (not authorization)
    const first = allowed.find(t => t !== 'authorization') || allowed[0];
    if (first) showPortalTab(first);

    // Hide overlay
    document.getElementById('loginOverlay').style.display = 'none';

    // Show user info
    const bar = document.getElementById('userInfoBar');
    if (bar) {
      const img = document.getElementById('userAvatar');
      const nm  = document.getElementById('userName');
      if (img) img.src = picture;
      if (nm)  nm.textContent = name.split(' ')[0];
      bar.style.display = 'flex';
    }

  } catch(err) {
    errEl.textContent = 'Login error: ' + err.message;
    errEl.style.display = 'block';
  }
}

// ── Tab click handler override for Authorization tab ─────────
document.getElementById('tabs').addEventListener('click', function(e) {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const target = btn.dataset.target;
  if (!target) return;
  e.stopImmediatePropagation();  // prevent original handler double-firing
  showPortalTab(target);
}, true);  // capture phase so it runs before the original listener

// ── AUTH PANEL — admin UI ────────────────────────────────────
async function loadAuthPanel() {
  const panel = document.getElementById('frame-authorization');
  panel.innerHTML = '<div style="text-align:center;padding:48px;color:#7a8fb8;font-size:15px;">Loading users…</div>';
  try {
    const r = await fetch('/api/user-permissions');
    __authUsers = await r.json();
    renderAuthPanel();
  } catch(err) {
    panel.innerHTML = '<div style="color:#dc2626;padding:24px;">Error: ' + err.message + '</div>';
  }
}

function renderAuthPanel() {
  const panel = document.getElementById('frame-authorization');
  const perms = window.__userPerms;
  const isAdmin = perms && perms.email === ADMIN_EMAIL;

  let html = '<div class="auth-panel">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">';
  html += '<h2 style="margin:0;font-size:20px;color:#16264d;font-weight:700;">Authorization Management</h2>';
  if (isAdmin) {
    html += '<button onclick="openAddUser()" style="background:#0073C8;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;">+ Add User</button>';
  }
  html += '</div>';

  if (!Array.isArray(__authUsers) || !__authUsers.length) {
    html += '<p style="color:#7a8fb8;">No users found.</p>';
  } else {
    html += '<div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(20,42,92,.07);">';
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#f4f6fa;"><th style="padding:12px 16px;text-align:left;color:#7a8fb8;font-weight:700;font-size:11px;letter-spacing:.06em;">EMAIL</th><th style="padding:12px 16px;text-align:left;color:#7a8fb8;font-weight:700;font-size:11px;">TABS</th><th style="padding:12px 16px;text-align:left;color:#7a8fb8;font-weight:700;font-size:11px;">REGIONS</th><th style="padding:12px 16px;text-align:left;color:#7a8fb8;font-weight:700;font-size:11px;">STATUS</th>';
    if (isAdmin) html += '<th style="padding:12px 16px;"></th>';
    html += '</tr></thead><tbody>';

    __authUsers.forEach((u, idx) => {
      const bg = idx % 2 === 0 ? '#fff' : '#f9fafc';
      const tabs = (u.allowed_tabs || []).join(', ') || '—';
      const regions = (u.allowed_regions || []).length ? u.allowed_regions.join(', ') : 'All regions';
      const status = u.is_active
        ? '<span style="background:#dcfce7;color:#16a34a;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;">Active</span>'
        : '<span style="background:#fee2e2;color:#dc2626;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;">Disabled</span>';
      html += `<tr style="background:${bg};border-top:1px solid #f0f2f7;">`;
      html += `<td style="padding:13px 16px;color:#16264d;font-weight:600;">${u.email}</td>`;
      html += `<td style="padding:13px 16px;color:#3b5384;">${tabs}</td>`;
      html += `<td style="padding:13px 16px;color:#3b5384;max-width:280px;">${regions}</td>`;
      html += `<td style="padding:13px 16px;">${status}</td>`;
      if (isAdmin) {
        const canDelete = u.email !== ADMIN_EMAIL;
        html += `<td style="padding:13px 16px;white-space:nowrap;">`;
        html += `<button onclick="openEditModal('${u.email}')" style="background:#f0f4ff;color:#0073C8;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;margin-right:6px;">Edit</button>`;
        if (canDelete) {
          html += `<button onclick="deleteUser('${u.email}')" style="background:#fff1f1;color:#dc2626;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;">Remove</button>`;
        }
        html += `</td>`;
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  panel.innerHTML = html;
}

async function openAddUser() {
  __editingEmail = null;
  document.getElementById('editModalTitle').textContent = 'Add New User';
  await loadAuthRegions();
  renderEditModal(null);
  document.getElementById('editModalOverlay').classList.add('open');
}

async function openEditModal(email) {
  __editingEmail = email;
  const user = __authUsers.find(u => u.email === email);
  document.getElementById('editModalTitle').textContent = 'Edit: ' + email;
  await loadAuthRegions();
  renderEditModal(user);
  document.getElementById('editModalOverlay').classList.add('open');
}

function renderEditModal(user) {
  const tabKeys = ['leads','potentials','aiagents','createleads'];
  const allowedTabs = user ? (user.allowed_tabs || []) : ['leads','potentials'];
  const allowedRegions = user ? (user.allowed_regions || []) : [];

  const TAB_LABELS = {leads:'📊 Leads',potentials:'📈 Potentials',aiagents:'🤖 AI Agents',createleads:'➕ Create Lead'};
  let tabHtml = tabKeys.map(k =>
    `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;background:#f4f6fa;padding:8px 14px;border-radius:8px;font-size:13px;">
      <input type="checkbox" value="${k}" ${allowedTabs.includes(k)?'checked':''} style="width:15px;height:15px;">
      ${TAB_LABELS[k]||k}
    </label>`
  ).join('');
  document.getElementById('editTabsCheckboxes').innerHTML = tabHtml;

  let regionHtml = __authRegions.map(r =>
    `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;">
      <input type="checkbox" value="${r}" ${allowedRegions.includes(r)?'checked':''} style="width:13px;height:13px;">
      ${r}
    </label>`
  ).join('');
  document.getElementById('editRegionsCheckboxes').innerHTML = regionHtml;

  const msgEl = document.getElementById('editMsg');
  msgEl.style.display = 'none';

  // Email input for new user
  let emailRow = '';
  if (!__editingEmail) {
    emailRow = `<div style="margin-bottom:20px;">
      <div style="font-size:11px;font-weight:700;color:#7a8fb8;letter-spacing:.07em;margin-bottom:6px;">EMAIL</div>
      <input id="newUserEmail" type="email" placeholder="user@elmeasure.com"
        style="width:100%;padding:9px 12px;border:1px solid #d8dce6;border-radius:8px;font-size:13px;box-sizing:border-box;">
    </div>`;
  }
  // Prepend email row
  const container = document.querySelector('#editModalOverlay > div');
  const existing = document.getElementById('newUserEmailRow');
  if (existing) existing.remove();
  if (!__editingEmail) {
    const div = document.createElement('div');
    div.id = 'newUserEmailRow';
    div.innerHTML = emailRow;
    container.insertBefore(div, container.querySelector('div'));
  }
}

function toggleAllRegions(checked) {
  document.querySelectorAll('#editRegionsCheckboxes input[type=checkbox]').forEach(cb => cb.checked = checked);
}

function closeEditModal() {
  document.getElementById('editModalOverlay').classList.remove('open');
}

async function saveUserEdit() {
  const msgEl = document.getElementById('editMsg');
  msgEl.style.display = 'none';
  try {
    const tabs = [...document.querySelectorAll('#editTabsCheckboxes input:checked')].map(i => i.value);
    const regions = [...document.querySelectorAll('#editRegionsCheckboxes input:checked')].map(i => i.value);

    let email = __editingEmail;
    if (!email) {
      const inp = document.getElementById('newUserEmail');
      email = inp ? inp.value.trim().toLowerCase() : '';
      if (!email || !email.endsWith('@elmeasure.com')) {
        msgEl.textContent = 'Please enter a valid @elmeasure.com email.';
        msgEl.style.color = '#dc2626'; msgEl.style.display = 'block'; return;
      }
    }

    const isNew = !__editingEmail; // new user if no editing email
    const r = await fetch('/api/user-permissions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        adminEmail: ADMIN_EMAIL,
        email,
        allowed_tabs: tabs,
        allowed_regions: regions,
        is_active: true
      })
    });
    if (!r.ok) {
      const e = await r.json();
      throw new Error(e.error || r.status);
    }
    // Send email notification (fire-and-forget — don't block the save)
    fetch('/api/send-email', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ toEmail: email, tabs, regions, isNew, changedBy: ADMIN_EMAIL })
    }).catch(() => {}); // silently ignore email errors
    msgEl.textContent = '✓ Saved & notification sent';
    msgEl.style.color = '#16a34a'; msgEl.style.display = 'block';
    setTimeout(() => { closeEditModal(); loadAuthPanel(); }, 800);
  } catch(err) {
    msgEl.textContent = '✗ ' + err.message; msgEl.style.color = '#dc2626';
    msgEl.style.display = 'block';
  }
}

async function deleteUser(email) {
  if (!confirm('Remove ' + email + '?')) return;
  try {
    const r = await fetch('/api/user-permissions?email=' + encodeURIComponent(email) +
                          '&adminEmail=' + encodeURIComponent(ADMIN_EMAIL), { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    loadAuthPanel();
  } catch(err) {
    alert('Error: ' + err.message);
  }
}

async function toggleActive(email, active) {
  try {
    await fetch('/api/user-permissions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ adminEmail: ADMIN_EMAIL, email, is_active: active })
    });
    loadAuthPanel();
  } catch(err) { alert('Error: ' + err.message); }
}

// Close modal on overlay click
document.getElementById('editModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});
</script>
