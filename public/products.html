<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>
<!-- Products tab (17-Nov-2026). Product families with the same targets and rules as PM Cumulative Tracking
     (quarter split 20/25/25/30 %, shortfall carried to the next month, Prepaid/Smart without Govt Projects,
     OEM accounts moved to OEM). Data: prd_cube (OB + invoices), rt_pend (pending to bill, frozen daily at 9 pm),
     prd_pipe (potentials, valued from their product lines), prd_leads (leads by week) – supabase/products.sql. -->
<style>
  :root{
    --navy:#0B2942; --head:#1a5f9e; --volt:#0073C8; --bg:#eef2f8; --panel:#fff; --line:#e3e7ef;
    --t1:#16264d; --t2:#3b5384; --t3:#7a8fb8; --pm:#8a7a9c;
    --good:#0f7a36; --good-bg:#e3f4e8; --warn:#9a5b00; --warn-bg:#fff1d9; --bad:#b42323; --bad-bg:#fde8e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Calibri','Carlito','Segoe UI',sans-serif;font-size:14px}
  .wrap{max-width:1400px;margin:0 auto;padding:16px 16px 40px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
  .ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:3px;position:relative}
  .f label{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--t3);text-transform:uppercase}
  select{border:1px solid #cfd6e3;background:#fff;border-radius:8px;padding:7px 10px;font:inherit;color:var(--t1);cursor:pointer}
  input[type=search],input[type=date]{border:1px solid #cfd6e3;background:#fff;border-radius:8px;padding:6px 10px;font:inherit;color:var(--t1)}
  .sync{font-size:12px;color:var(--t3);text-align:right;line-height:1.5}
  .sync b{color:var(--t2)}
  .btn{font:inherit;font-size:12.5px;border:1px solid var(--volt);color:var(--volt);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  h2{font-size:15px;margin:0}
  .sub{font-size:12px;color:var(--t3)}
  .err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:none}
  .loading{position:fixed;inset:0;background:rgba(238,242,248,.6);display:none;align-items:center;justify-content:center;z-index:150;font-weight:700;color:var(--t2)}
  .loading.on{display:flex}

  /* product chips */
  /* 25-Nov-2026: product selector = card buttons (name, PM, OB % bar) */
  .chips{display:grid;grid-template-columns:minmax(190px,1.25fr) repeat(8,minmax(118px,1fr));gap:8px;margin-bottom:16px}
  .chips button{font:inherit;text-align:left;border:1px solid var(--line);background:#fff;color:var(--t1);border-radius:12px;padding:9px 11px 10px;cursor:pointer;
    display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;transition:transform .12s,box-shadow .12s,border-color .12s}
  .chips button:hover{border-color:#9cc3ea;box-shadow:0 4px 14px rgba(11,41,66,.10);transform:translateY(-1px)}
  .chips button:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
  .chips .cn{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips .ci{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;letter-spacing:0}
  .chips .cp{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips .cb{height:4px;background:#e6ecf5;border-radius:3px;overflow:hidden;margin-top:3px}
  .chips .cb i{display:block;height:100%;border-radius:3px}
  .chips .cr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0}
  .chips .cv{font-size:11.5px;font-weight:800;flex:0 0 auto}
  .chips button.on{border-color:var(--volt);box-shadow:0 0 0 2px var(--volt) inset,0 6px 18px rgba(0,115,200,.18);background:#f3f8ff}
  .chips button.cum{background:linear-gradient(125deg,#0b2942,#0073c8);color:#fff;border-color:transparent}
  .chips button.cum .cp{color:#bcd3ee} .chips button.cum .cb{background:rgba(255,255,255,.22)} .chips button.cum .ci{background:rgba(255,255,255,.18)!important}
  .chips button.cum.on{box-shadow:0 0 0 3px #9fd0ff,0 8px 22px rgba(0,115,200,.35)}
  .chips button.cum .cv{color:#fff}
  @media(max-width:1250px){.chips{grid-template-columns:repeat(5,minmax(0,1fr))}}
  @media(max-width:760px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:480px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
  tr.det td{background:#fafbfd;padding:6px 12px 10px 34px;font-size:12px;color:var(--t2);text-align:left;white-space:normal}
  .mini{width:100%;font-size:12px;margin-top:4px}
  .mini td,.mini th{padding:4px 8px;border-bottom:1px solid #eef1f6;text-align:right}
  .mini th{background:#eef2f8;color:var(--t3)}
  .mini td:first-child,.mini th:first-child{text-align:left}
  tr.prod td:first-child{font-weight:700}
  tr.grand td{background:#eaf2fd;border-top:2px solid #9cc3ea}
  .gobtn{font:inherit;font-size:11px;font-weight:700;border:1px solid #cfe0f5;background:#fff;color:var(--volt);border-radius:12px;padding:1px 8px;margin-left:8px;cursor:pointer}
  .hero .ck:hover{background:rgba(255,255,255,.08)}

  /* F: hero strip */
  .hero{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--navy);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .hero>div{padding:14px 16px;border-right:1px solid rgba(255,255,255,.12);color:#fff;min-width:0}
  .hero>div:last-child{border-right:0}
  .hero .l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9fc0e6}
  .hero .v{font-size:24px;font-weight:800;margin-top:4px;white-space:nowrap}
  .hero .v small{font-size:12px;color:#9fc0e6;font-weight:700}
  .hero .s{font-size:12px;color:#c9d8ee;margin-top:3px}
  .hero .up{color:#6fe39b}.hero .dn{color:#ff9a9a}
  @media(max-width:1000px){.hero{grid-template-columns:repeat(3,minmax(0,1fr))}.hero>div{border-bottom:1px solid rgba(255,255,255,.12)}}
  @media(max-width:560px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .v{font-size:20px}}

  /* B / D: tiles with bars */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  @media(max-width:1000px){.tiles{grid-template-columns:minmax(0,1fr)}}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tile .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
  .tile .v{font-size:24px;font-weight:800;color:var(--navy);margin-top:4px}
  .tile .v small{font-size:13px;color:var(--t3);font-weight:700}
  .tile .s{font-size:12.5px;color:var(--t2);margin-top:6px;line-height:1.45}
  .pbar{position:relative;height:12px;background:#e6ecf5;border-radius:8px;margin:22px 0 6px}
  .pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;max-width:100%}
  .pbar em{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--navy);border-radius:2px;margin-left:-1px}
  .pbar em:after{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;font-style:normal;color:var(--navy);font-weight:700;white-space:nowrap}
  .pbar em.r:after{left:auto;right:0;transform:none}
  .pbar em.lft:after{left:0;transform:none}
  .chip{display:inline-block;text-align:center;font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .c-good{color:var(--good);background:var(--good-bg)} .c-warn{color:var(--warn);background:var(--warn-bg)} .c-bad{color:var(--bad);background:var(--bad-bg)} .c-na{color:var(--t3);background:#eceff4}
  .secttl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--t3);text-transform:uppercase;margin:4px 2px 8px}

  /* tables */
  .tbl{overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{background:var(--head);color:#fff;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:right;padding:9px 12px;white-space:nowrap}
  th.l,td.l{text-align:left}
  td{padding:8px 12px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td.pm{color:var(--pm);font-size:12px}
  tr.q td{background:#f3f7fd;font-weight:700;color:var(--navy)}
  tr.tot td{color:var(--volt);font-weight:700;background:#f7faff;border-top:2px solid #cfe0f5}
  tr.fut td{color:#a9b6cf}
  tr.ck{cursor:pointer} tr.ck:hover td{background:#f7f9fd}
  tr.sub td{background:#fafbfd;color:var(--t2);font-size:12.5px}
  tr.sub td:first-child{padding-left:30px}
  .caret{display:inline-block;width:14px;color:var(--t3);font-size:11px}
  .hb{display:inline-block;height:7px;border-radius:4px;background:var(--volt);opacity:.7;margin-left:8px;vertical-align:middle}
  .h-good{background:#d9f0e0!important;color:var(--good)!important;font-weight:700}
  .h-ok{background:#eaf6d9!important;color:#4d7a0a!important;font-weight:700}
  .h-warn{background:#fff1d9!important;color:var(--warn)!important;font-weight:700}
  .h-bad{background:#fde8e8!important;color:var(--bad)!important;font-weight:700}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--t3);margin-top:8px;align-items:center}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  @media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
  .toggle{display:inline-flex;background:#dfe6f1;border-radius:10px;padding:3px}
  .toggle button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font:inherit;font-weight:700;color:var(--t2);cursor:pointer}
  .toggle button.on{background:#fff;color:var(--volt);box-shadow:0 1px 4px rgba(11,41,66,.15)}
  .fl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
  .kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
  @media(max-width:760px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .k{border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .k .l{font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
  .k .v{font-size:19px;font-weight:800;margin-top:2px}.k .n{font-size:11.5px;color:var(--t3)}
  .chart svg{display:block;width:100%;height:auto}
  .tip{position:fixed;pointer-events:none;background:#0f1f3a;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;display:none;line-height:1.5}
  .gr-up{color:var(--good);font-weight:700} .gr-dn{color:var(--bad);font-weight:700}
  .est{color:var(--warn);font-weight:700;cursor:help}
  .st-Open{color:var(--volt);font-weight:700}.st-Won{color:var(--good);font-weight:700}.st-Lost{color:var(--bad);font-weight:700}
  .acct{font-weight:700;color:var(--t1)} .acct small{display:block;font-weight:400;color:var(--t3);font-size:11.5px}
  td.wrapc{white-space:normal;min-width:200px;text-align:left}
  .more{text-align:center;margin-top:8px}
  .note{font-size:12px;color:var(--t2);line-height:1.55;margin-top:10px}
  /* overview bars */
  .ob-row{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f3f8}
  .ob-row .n{font-weight:700}
  .ob-row .p{font-weight:800;text-align:right}
  .ob-row .pbar{margin:8px 0}
  @media(max-width:560px){.ob-row{grid-template-columns:90px minmax(0,1fr) 54px}}

  /* 24-Nov-2026: multiselects, clickable charts, pop-ups (same look as PM Cumulative) */
  .ms-btn{border:1px solid #cfd6e3;background:#fff;border-radius:8px;padding:7px 28px 7px 10px;font:inherit;color:var(--t1);cursor:pointer;min-width:170px;text-align:left;position:relative}
  .ms-btn:after{content:'▾';position:absolute;right:10px;top:7px;color:var(--t3)}
  .ms-pop{display:none;position:absolute;top:100%;left:0;margin-top:4px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(11,41,66,.18);width:270px;padding:8px}
  .ms-pop.open{display:block}
  .ms-acts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .ms-acts button{font:inherit;font-size:11.5px;border:1px solid #cfd6e3;background:#f6f8fb;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--t2)}
  .ms-list{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .ms-list.long{display:block;max-height:280px;overflow:auto}
  .f .ms-list label,.ms-list label{display:flex;gap:6px;align-items:center;padding:5px 4px;border-radius:5px;cursor:pointer;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--t1)}
  .chart.fit{max-width:900px}
  .ms-list label:hover{background:#f1f5fb}
  .ms-q{width:100%;margin-bottom:6px}
  .ck{cursor:pointer}
  .og{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:4px;white-space:nowrap}
  .og.new{background:#e3f6ea;color:#0f7a36} .og.old{background:#fdf0dc;color:#9a5a00}
  .lsr{font-size:11.5px;color:#3b5384;line-height:1.5}
  a.zl{text-decoration:none;color:var(--t1)} a.zl:hover{color:var(--volt)} a.zl .zx{color:var(--volt);font-size:11px}
  th.srt{cursor:pointer;user-select:none} th.srt:hover{background:#13497b}
  th.srt:after{content:' ⇅';opacity:.45;font-size:10px} th.srt.asc:after{content:' ▲';opacity:1} th.srt.desc:after{content:' ▼';opacity:1}
  svg .ck:hover rect{opacity:.85}
  .hdr-f{margin:0;justify-content:flex-end}
  .card-h .fl.hdr-f .f label{text-align:left}
  a.dd{color:inherit;text-decoration:none;border-bottom:1px dashed #9db3d6;cursor:pointer}
  a.dd:hover{color:var(--volt);border-bottom-color:var(--volt)}
  .dd-ov{position:fixed;inset:0;background:rgba(11,41,66,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px}
  .dd-box{background:#fff;border-radius:16px;width:min(1080px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
  .dd-hd{background:linear-gradient(120deg,#0b2942,#0073c8);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .dd-hd h3{margin:0;font-size:18px}.dd-hd .s{font-size:12px;opacity:.85;margin-top:3px}
  .dd-hd .toggle{background:rgba(255,255,255,.18)}.dd-hd .toggle button{color:#fff}.dd-hd .toggle button.on{color:var(--volt)}
  .dd-x{background:rgba(255,255,255,.15);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
  .dd-bd{overflow:auto;padding:12px 18px 18px}
  .dd-kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .dd-k{border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .dd-k .l{font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
  .dd-k .v{font-size:19px;font-weight:800;margin-top:2px}.dd-k .n{font-size:11.5px;color:var(--t3)}
  .dd-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dd-cap{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.06em;margin:4px 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .dd-tb{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .dd-tb table th{position:sticky;top:0;z-index:2}
  .dd-tb tr.sel td{background:#e8f1ff}
  .dd-tb tr.ck:hover td{background:#f3f7fd}
  .dd-bar{display:inline-block;height:7px;border-radius:4px;background:var(--volt);opacity:.75;margin-left:8px;vertical-align:middle}
  .dd-docs{max-height:420px;margin-top:4px}
  .dd-tb tr.it td{background:#f7faff;color:var(--t2);font-size:12.5px}
  .dd-docs a.doc{color:var(--volt);font-weight:700;text-decoration:none;cursor:pointer}
  .dd-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
  .dd-tools input{font:inherit;padding:6px 10px;border:1px solid #cfd6e3;border-radius:8px;width:260px;max-width:100%}
  .dd-flt{font-size:12px;background:#e8f1ff;color:var(--volt);border-radius:20px;padding:3px 10px;font-weight:700}
  .dd-flt button{border:0;background:none;color:var(--volt);font-weight:800;cursor:pointer;padding:0 0 0 4px}
  .dd-load{padding:30px;text-align:center;color:var(--t3)}
  @media (max-width:760px){.dd-ov{padding:0}.dd-box{max-height:100vh;height:100vh;border-radius:0}.dd-kp{grid-template-columns:1fr 1fr}.dd-two{grid-template-columns:1fr}.dd-hd h3{font-size:16px}.dd-tools input{width:100%}.hdr-f{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">

</div>
<div class="loading" id="loading">Loading…</div>
<div class="tip" id="tip"></div>

function famOfBasket(b, gov){
  b = String(b || '').trim().replace(/\s+/g, ' ');
  if (['Panel Meters','High End MFM','Nano VIP','Power Quality'].includes(b)) return 'Panel Meters';
  if (b === 'ACCL') return 'ACCL';
  if (b === 'Transfer Switch') return 'ATES';
  if (['Prepaid & Smart Meters','Prepaid','Smart Meters'].includes(b)) return gov ? GOVT : 'Prepaid/Smart';

  if (b === 'FDP') return 'FDP';

}

/* ---------------- time helpers ---------------- */
function curMonth(){ const md = S.cube?.max_date; if (!md) return MONTHS[MONTHS.length - 1]; return new Date(md).getMonth() + 1; }
function curIdx(){ return MONTHS.indexOf(curMonth()); }
const pastMonths = () => MONTHS.slice(0, curIdx() + 1);
function planShareTo(m){ // share of the FY target planned up to the end of month m
  let s = 0; for (const x of MONTHS) { s += QUARTER_SHARE[QOF(x)] / 3; if (x === m) break; } return s; }
function monthDays(){ // day of the latest month and days in it (calendar)
  const md = S.cube?.max_date ? new Date(S.cube.max_date) : new Date();
  const y = md.getFullYear(), m = md.getMonth();
  const dim = new Date(y, m + 1, 0).getDate();
  const now = new Date(); const sameMonth = now.getFullYear() === y && now.getMonth() === m;
  return { day: sameMonth ? now.getDate() : dim, dim };
}

    o[x.m] = (o[x.m] || 0) + x.v; const kl = k + '|lv'; const ol = (M[kl] = M[kl] || {}); ol[x.m] = (ol[x.m] || 0) + x.lv; });

/* ---------------- calculations ---------------- */
const mv = (fam, doc, y, m, lv) => ((S.M || {})[fam + '|' + doc + '|' + y + (lv ? '|lv' : '')] || {})[m] || 0;
// Month-by-month plan with the shortfall carried forward (same as PM Cumulative):
// month target = plan share + net shortfall still pending; extra above target is kept as a balance.
function runOf(fam, doc){
  const T = tgtOf(fam, S.fy); let net = 0;
  return MONTHS.map(m => {
    const a = mv(fam, doc, 0, m);
    if (T == null) return { m, plan:null, cin:0, tgt:null, a, cout:0, bank:0 };
    const plan = T * QUARTER_SHARE[QOF(m)] / 3, cin = Math.max(0, net), tgt = plan + cin;
    net = net + plan - a;
    return { m, plan, cin, tgt, a, cout:Math.max(0, net), bank:Math.max(0, -net) };
  });
}
function famStats(fam){
  const T = tgtOf(fam, S.fy), cm = curMonth(), past = pastMonths();
  const sum = (doc, y, lv) => MONTHS.reduce((t, m) => t + mv(fam, doc, y, m, lv), 0);
  const ytd = (doc, y, lv) => past.reduce((t, m) => t + mv(fam, doc, y, m, lv), 0);
  const ob = sum('OB', 0), inv = sum('INV', 0);
  const lyOb = ytd('OB', 1, true), lyInv = ytd('INV', 1, true);
  const share = planShareTo(cm), plan = T == null ? null : T * share;
  const rOb = runOf(fam, 'OB'), rInv = runOf(fam, 'INV');
  const ci = curIdx();
  const pend = S.pend && !S.pend.err ? (S.pend.by[fam] || 0) : null;
  return { fam, T, ob, inv, lyOb, lyInv, share, plan, rOb, rInv, cur:{ ob:rOb[ci], inv:rInv[ci] },
           carriedOb: ci > 0 ? rOb[ci - 1].cout : 0, carriedInv: ci > 0 ? rInv[ci - 1].cout : 0, pend };
}
function pipeOf(fam){
  if (!S.pipe || S.pipe.err) return null;
  const ym = monthKey(curMonth());
  let open = 0, w = 0, n = 0, openAll = 0, wAll = 0, won = 0;
  S.pipe.sum.forEach(a => { if (fam && a[0] !== fam) return; if (!fam && a[0] === GOVT) return;
    if (a[1] === 'Open') { openAll += +a[5]; wAll += +a[6]; if (a[2] === ym) { open += +a[5]; w += +a[6]; n += +a[4]; } }
    if (a[1] === 'Won') won += +a[5]; });
  return { open, w, n, openAll, wAll, won };
}
function monthKey(m){ const y = m >= 4 ? S.fy : S.fy + 1; return y + '-' + String(m).padStart(2, '0'); }
function heat(p){ return p == null ? '' : p >= 100 ? 'h-good' : p >= 90 ? 'h-ok' : p >= 75 ? 'h-warn' : 'h-bad'; }
function chipFor(p){ return p == null ? '<span class="chip c-na">—</span>' : `<span class="chip ${p >= 100 ? 'c-good' : p >= 80 ? 'c-warn' : 'c-bad'}">${fp(p)}</span>`; }
function grTxt(cy, ly){ if (!ly) return cy ? '<span class="gr-up">new</span>' : '—'; const g = (cy - ly) / ly * 100; return `<span class="${g >= 0 ? 'gr-up' : 'gr-dn'}">${g >= 0 ? '▲' : '▼'} ${Math.abs(g).toFixed(1)}%</span>`; }
function barColor(p, plan){ return p == null ? '#9fb3d1' : p >= plan ? '#16a34a' : p >= plan * 0.85 ? '#e08a00' : '#b42323'; }
function pbar(pct, planPct, color, label){
  const w = Math.max(0, Math.min(100, pct || 0)), pl = Math.max(0, Math.min(100, planPct));
  return `<div class="pbar"><i style="width:${w}%;background:${color}"></i><em class="${pl > 80 ? 'r' : pl < 15 ? 'lft' : ''}" style="left:${pl}%" data-l="${esc(label)}"></em></div>`;
}

/* ---------- 1A: month chart (bars coloured by % of revised target, dashed revised target, thin plan) ---------- */
function heatCol(p){ return p == null ? '#0073C8' : p >= 100 ? '#16a34a' : p >= 90 ? '#7cb342' : p >= 75 ? '#e08a00' : '#b42323'; }
function monthChart1A(run, doc, fam){
  const ci = curIdx(), hasT = run.some(r => r.tgt != null);
  const W = 640, H = 240, pl = 48, pr = 10, pt = 22, pb = 26, cw = (W - pl - pr) / 12;
  const mx = Math.max(1, ...run.map((r, i) => Math.max(i <= ci ? r.a : 0, hasT && i <= ci ? r.tgt : 0, hasT ? r.plan : 0))) * 1.12;
  const y = v => pt + (H - pt - pb) * (1 - Math.max(0, v) / mx);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let g = 0; g <= 4; g++) { const v = mx * g / 4; s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f6"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#7a8fb8">${f0(v)}</text>`; }
  run.forEach((r, i) => { const x = pl + i * cw, bw = cw * .56, bx = x + (cw - bw) / 2;
    if (i <= ci) { const p = hasT ? pc(r.a, r.tgt) : null;
      s += `<rect x="${bx}" y="${y(r.a)}" width="${bw}" height="${Math.max(0, H - pb - y(r.a))}" rx="4" fill="${heatCol(p)}" ${i === ci ? 'opacity=".75"' : ''} class="ck" data-m="${r.m}" data-tip="${esc(MNAME[r.m] + ': achieved ₹' + f2(r.a) + ' L' + (hasT ? ' · revised target ₹' + f2(r.tgt) + ' L (' + fp(p) + ') · plan ₹' + f2(r.plan) + ' L' : '') + ' · click for breakdown')}"/>`;
      s += `<text x="${x + cw / 2}" y="${y(r.a) - 4}" font-size="9.5" text-anchor="middle" fill="#3b5384">${f0(r.a)}</text>`; }
    s += `<text x="${x + cw / 2}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="${i > ci ? '#a9b6cf' : '#3b5384'}">${MNAME[r.m]}</text>`; });
  if (hasT) {
    s += `<polyline points="${run.slice(0, ci + 1).map((r, i) => `${pl + i * cw + cw / 2},${y(r.tgt)}`).join(' ')}" fill="none" stroke="#0B2942" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<polyline points="${run.map((r, i) => `${pl + i * cw + cw / 2},${y(r.plan)}`).join(' ')}" fill="none" stroke="#9fb3d1" stroke-width="1.5"/>`;
  }
  return s + '</svg>';
}
function monthTable(run, title, id){

function seriesBars2A(list, k, all){

  let s = `<svg viewBox="0 0 ${W} ${H}">`;

function leadFams(pt){ const toks = String(pt || '').split(',').map(t => t.trim()).filter(Boolean); return [...new Set(toks.map(pfam))]; }
function leadRows(fam){   // this family's leads: { id, d, rg, ow, n, v, est, nm, co, sr }
  const L = S.lf && S.lf[fam];
  if (L && !L.err && L.cy === S.fy) return L.rows.map(a => ({ id:a[0], d:a[1], rg:a[2], ow:a[3], nm:a[4], co:a[5], n:1, v:+a[6], est:!!a[7], sr:a[8] || [] }));
  if (!S.leads || S.leads.err) return [];
  const out = []; S.leads.rows.forEach(a => { const fs = leadFams(a[1]); if (!fs.includes(fam)) return; out.push({ d:a[0], rg:a[2], ow:a[3], n:+a[4], v:+a[5] / fs.length }); });
  return out;
}
const weekOf = d => Math.min(5, Math.ceil(+d.slice(8, 10) / 7));
function leadsCard(fam){
  const head = `<h2>Leads — ${esc(fam)}</h2>`;
  if (!S.leads) return `<div class="card"><div class="card-h">${head}</div><div class="note">Loading leads…</div></div>`;
  if (S.leads.err) return `<div class="card"><div class="card-h">${head}</div><div class="note">Leads not available yet (${esc(S.leads.err)}). Run <b>supabase/products_v2.sql</b> in Supabase.</div></div>`;
  const m = S.leadM || curMonth(), mk = monthKey(m);
  const R = leadRows(fam), cur = R.filter(r => r.d.slice(0, 7) === mk);
  const wk = [1, 2, 3, 4, 5].map(w => { const a = cur.filter(r => weekOf(r.d) === w);
    return { w, n:a.reduce((t, r) => t + r.n, 0), v:a.reduce((t, r) => t + r.v, 0) }; });
  const tn = wk.reduce((t, x) => t + x.n, 0), tv = wk.reduce((t, x) => t + x.v, 0);
  const L = S.lf && S.lf[fam], byLines = L && !L.err && L.cy === S.fy;
  const fyN = R.filter(r => r.d >= `${S.fy}-04-01`).reduce((t, r) => t + r.n, 0);
  const W = 640, H = 220, pl = 40, pb = 28, pt = 22, cw = (W - pl - 10) / 5, mx = Math.max(1, ...wk.map(x => x.n)) * 1.15, y = v => pt + (H - pt - pb) * (1 - v / mx);

  wk.forEach((x, i) => { const cx = pl + i * cw + cw / 2, bw = cw * .42;
    svg += `<g class="ck" data-wk="${x.w}"><rect x="${cx - cw / 2}" y="${pt}" width="${cw}" height="${H - pt - pb}" fill="transparent"/>`;
    svg += `<rect x="${cx - bw / 2}" y="${y(x.n)}" width="${bw}" height="${Math.max(0, H - pb - y(x.n))}" rx="5" fill="#16a34a"/>`;
    if (x.n) svg += `<text x="${cx}" y="${y(x.n) - 14}" font-size="11.5" font-weight="700" text-anchor="middle" fill="#16264d">${x.n}</text><text x="${cx}" y="${y(x.n) - 3}" font-size="9.5" text-anchor="middle" fill="#3b5384">₹${f2(x.v)} L</text>`;
    svg += `<text x="${cx}" y="${H - 9}" font-size="11" text-anchor="middle" fill="#3b5384">Week ${x.w}</text><title>Week ${x.w}: ${x.n} leads · ₹${f2(x.v)} L · click for Region › Sales engineer › leads</title></g>`; });
  svg += '</svg>';
  const opts = pastMonths().slice().reverse().map(mm => `<option value="${mm}" ${mm === m ? 'selected' : ''}>${MNAME[mm]} ${String(mm >= 4 ? S.fy : S.fy + 1).slice(2)}</option>`).join('');
  return `<div class="card" id="leadCard"><div class="card-h"><div>${head}<div class="sub">${byLines ? `Leads created in Zoho with this product in their Products Information lines · value = this product's lines of the lead${L.synced ? ' (lines synced ' + new Date(L.synced).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) + ')' : ''}; leads without lines use Product / Solution type with an equal split (≈)` : 'Leads created in Zoho naming this product (Product / Solution type); value split equally when a lead names 2+ products'}. Week 1 = days 1–7, Week 5 = 29–31.</div></div>
      <div class="fl hdr-f"><div class="f"><label>Month</label><select id="leadM">${opts}</select></div></div></div>
    <div class="kp"><div class="k"><div class="l">Leads · ${MNAME[m]}</div><div class="v ck" data-wk="0">${tn}</div><div class="n">₹${f2(tv)} L · this product</div></div>
      <div class="k"><div class="l">Average per lead</div><div class="v">${tn ? '₹' + f2(tv / tn) + ' L' : '—'}</div><div class="n">${MNAME[m]} leads</div></div>

/* ---------- click a column header to sort (ascending / descending); total rows stay at the bottom ---------- */
function cellKey(td){
  if (!td) return null;
  const t = (td.innerText || td.textContent || '').replace(/\s+/g, ' ').trim();
  const m = t.replace(/[₹,%]|pcs|L\b/g, '').match(/[−-]?\d+(\.\d+)?/);
  if (m && /^[\s▲▼+−\-₹\d.,%A-Za-z()·]*$/.test(t) && /\d/.test(t) && !/^[A-Za-z]/.test(t)) {
    let v = parseFloat(m[0].replace('−', '-')); if (/▼/.test(t) || /^−/.test(t)) v = -Math.abs(v); return v; }
  if (t === '—' || t === '') return -Infinity;
  return t.toLowerCase();
}
function sortTable(t, col, dir){
  const tb = t.tBodies[0]; if (!tb) return;
  const blocks = [], fixed = [];
  [...tb.rows].forEach(r => {
    if (r.classList.contains('tot') || r.classList.contains('q')) { fixed.push(r); return; }
    if ((r.classList.contains('sub') || r.classList.contains('it')) && blocks.length) { blocks[blocks.length - 1].push(r); return; }
    blocks.push([r]); });
  blocks.forEach((b, i) => b.i = i);
  blocks.sort((a, b) => { const x = cellKey(a[0].cells[col]), y = cellKey(b[0].cells[col]);
    if (x === y) return a.i - b.i;
    if (typeof x === 'number' && typeof y === 'number') return dir * (x - y);
    if (typeof x === 'number') return -1; if (typeof y === 'number') return 1;
    return dir * String(x).localeCompare(String(y)); });
  blocks.forEach(b => b.forEach(r => tb.appendChild(r))); fixed.forEach(r => tb.appendChild(r));
}
function enableSort(root){
  if (!root) return;
  root.querySelectorAll('table').forEach((t, n) => {
    if (t.dataset.nosort || !t.tHead || t.tHead.rows.length !== 1) return;
    const key = t.id || (root.id || 'x') + ':' + n, hs = [...t.tHead.rows[0].cells];
    hs.forEach((th, i) => { th.classList.add('srt'); th.title = 'Click to sort';
      th.onclick = e => { e.stopPropagation(); const cur = S.sort[key], dir = cur && cur.col === i ? -cur.dir : (i === 0 ? 1 : -1);
        S.sort[key] = { col:i, dir }; hs.forEach(h => h.classList.remove('asc', 'desc')); th.classList.add(dir > 0 ? 'asc' : 'desc'); sortTable(t, i, dir); }; });
    const st = S.sort[key]; if (st && hs[st.col]) { hs[st.col].classList.add(st.dir > 0 ? 'asc' : 'desc'); sortTable(t, st.col, st.dir); }
  });
}

function groupBars(groups, colors, names){
  const W = 560, H = 240, pl = 44, pb = 26, pt = 10, n = groups.length, k = colors.length;
  const mx = Math.max(1, ...groups.flatMap(g => g.vals)) * 1.1, gw = (W - pl - 10) / n, bw = Math.min(30, (gw - 18) / k);
  const y = v => pt + (H - pt - pb) * (1 - v / mx);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= 4; i++) { const v = mx / 4 * i; s += `<line x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f6"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#7a8fb8">${f0(v)}</text>`; }
  groups.forEach((g, i) => { const x0 = pl + gw * i + (gw - bw * k) / 2;
    g.vals.forEach((v, j) => { s += `<rect x="${x0 + j * bw}" y="${y(v)}" width="${bw - 3}" height="${Math.max(0, H - pb - y(v))}" rx="3" fill="${colors[j]}" data-tip="${esc(g.k + ' · ' + names[j] + ': ₹' + f2(v) + ' L')}"/>`; });
    s += `<text x="${pl + gw * i + gw / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#3b5384" font-weight="700">${g.k}</text>`; });
  return s + '</svg>';
}
function lineChart(pts, ci){
  const W = 560, H = 240, pl = 44, pb = 26, pt = 12, n = pts.length;
  const mx = Math.max(1, ...pts.map(p => Math.max(p.cy || 0, p.lyFull || 0, p.ly || 0))) * 1.12;
  const x = i => pl + (W - pl - 16) * i / (n - 1), y = v => pt + (H - pt - pb) * (1 - v / mx);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= 4; i++) { const v = mx / 4 * i; s += `<line x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f6"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#7a8fb8">${f0(v)}</text>`; }
  const ly = pts.map((p, i) => `${x(i)},${y(i > ci ? p.lyFull : p.ly)}`).join(' ');

  return s + '</svg>';
}
